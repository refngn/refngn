# EXAMPLE OF MAIN CONFIG | Everything is possible to change

sites_active = "/etc/refngn/config/sites-active"

[[listen.v4]]
address = "0.0.0.0"
port = 80
tls = false
redirect_to_https = false

[[listen.v6]]
address = "::"
port = 80
tls = false
redirect_to_https = false

[[listen.v4]]
address = "0.0.0.0"
port = 443
tls = true

[[listen.v6]]
address = "::"
port = 443
tls = true

[server]
max_connections = 2048
graceful_shutdown_seconds = 30
header_timeout_seconds = 10
idle_timeout_seconds = 75
max_header_bytes = 32768
max_headers = 100
max_uri_bytes = 8192
request_body_bytes = 67108864

[logging]
level = "info"
access_log = "/var/log/refngn/access.log"
error_log = "/var/log/refngn/error.log"
format = "json"

[tls]
handshake_timeout_seconds = 10
versions = ["1.3", "1.2"]

[http2]
enabled = true
max_concurrent_streams = 100
max_header_list_size = 32768

# Experimental: requires a binary built with --features http3.
[http3]
enabled = false
max_request_body_bytes = 8388608

[security]
enabled = true
config = "/etc/refngn/config/security.toml"
